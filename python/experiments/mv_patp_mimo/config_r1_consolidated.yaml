# config_r1_consolidated.yaml
#
# R1 (Rv1-C8, Rv1-C9, Rv3-C4): one consolidated table replacing Tables I
# and III. All estimators, including the three robust baselines, on
# identical data: every estimator in a (k, n, p, sigma) configuration sees
# the same (Y, S, H) per replicate (default_rng(seed + rep)), so MSE ratios
# are paired. The MAL alpha axis is inert here and is not expanded.
# Run with --per-replicate for paired-bootstrap CIs.
#
# Noise: iid Student-t df in {3, 4, 5, 1000} plus exactly Gaussian.
#
# REDUCED GRID (p = 2 only). The full k x n x p grid (900 cells,
# config_r1_consolidated_full.yaml) extrapolates to ~10.5 h with
# --workers 8 from a 20-rep timing run (2026-11-04); this one to ~5.0 h.
# p = 4 is covered at n = 512 by config_r1_consolidated_p4.yaml (~0.8 h).
# Cells: 3 k x 3 n x 1 p x 5 noise x 10 estimators = 450 x 500 reps.

run_id: r1_consolidated

replicates: 500

grid:
  k: [2, 4, 8]
  n: [256, 512, 1024]
  p: [2]
  M_norm: [0.0]
  sigma_structure:
    - student_t_3
    - student_t_4
    - student_t_5
    - student_t_1000
    - gaussian

estimators:
  - ols
  - wishart_mle
  - matrix_t_mle
  - matrix_f_mle
  - matrix_pmm2
  - matrix_pmm3
  - opmm_alpha
  - huber_irls
  - whitened_huber
  - student_t_elementwise
