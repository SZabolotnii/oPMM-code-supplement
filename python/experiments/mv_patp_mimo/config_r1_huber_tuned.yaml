# config_r1_huber_tuned.yaml
#
# R1 (Rv1-C11): Huber regression with a tuned constant instead of the fixed
# c = 1.345. Same grid, replicate count and seed scheme as
# config_r1_consolidated.yaml (p = 2; k 2/4/8; n 256/512/1024; Student-t
# df 3/4/5/1000 plus Gaussian; data per replicate from
# default_rng(seed + rep), seed 42), so the data are identical to
# r1_consolidated and ols / opmm_alpha / huber_irls reproduce its reps.csv.
#
# Estimators: ols and opmm_alpha (anchors), huber_irls (c = 1.345, as in the
# paper), six fixed constants c in {0.7, 1.0, 1.345, 1.7, 2.0, 2.5}
# (huber_c1p345 is huber_irls itself, kept as an identity check), and
# huber_adaptive_c (c chosen per fit by minimum plug-in asymptotic variance
# on the standardised residuals of the c = 1.345 fit; rule in
# src/mv_patp/baseline/huber_adaptive_c.py; chosen c in reps.csv: c_hat).
# Run with --per-replicate for paired-bootstrap CIs.

run_id: r1_huber_tuned

replicates: 500

grid:
  k: [2, 4, 8]
  n: [256, 512, 1024]
  p: [2]
  M_norm: [0.0]
  sigma_structure:
    - student_t_3
    - student_t_4
    - student_t_5
    - student_t_1000
    - gaussian

estimators:
  - ols
  - opmm_alpha
  - huber_irls
  - huber_c0p7
  - huber_c1p0
  - huber_c1p345
  - huber_c1p7
  - huber_c2p0
  - huber_c2p5
  - huber_adaptive_c
