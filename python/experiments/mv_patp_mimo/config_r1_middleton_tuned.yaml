# config_r1_middleton_tuned.yaml
#
# R1 (Rv1-C11, author decision 2026-11-05): Huber regression with a tuned
# constant on the Middleton Class A block. Same grid, replicate count and
# seed scheme as config_r1_middleton.yaml (k = 2, n = 512, p = 2;
# A = 1.0 / 0.35 / 0.1, Gamma' = 0.1; 500 reps; data per replicate from
# default_rng(seed + rep), seed 42), so the data are identical to
# r1_middleton and ols / opmm_alpha / huber_irls reproduce its reps.csv.
#
# Estimators: ols and opmm_alpha (anchors), huber_irls (c = 1.345, as in the
# paper), six fixed constants c in {0.7, 1.0, 1.345, 1.7, 2.0, 2.5}
# (huber_c1p345 is huber_irls itself, kept as an identity check), and
# huber_adaptive_c (c chosen per fit from {0.5, 0.6, ..., 3.0} by minimum
# plug-in asymptotic variance on the standardised residuals of the
# c = 1.345 fit; rule in src/mv_patp/baseline/huber_adaptive_c.py; chosen c
# in reps.csv: c_hat). Run with --per-replicate for paired-bootstrap CIs.
# Cells: 3 noise x 10 estimators = 30.

run_id: r1_middleton_tuned

replicates: 500

grid:
  k: [2]
  n: [512]
  p: [2]
  M_norm: [0.0]
  sigma_structure:
    - middleton_A1p0_G0p1
    - middleton_A0p35_G0p1
    - middleton_A0p1_G0p1

estimators:
  - ols
  - opmm_alpha
  - huber_irls
  - huber_c0p7
  - huber_c1p0
  - huber_c1p345
  - huber_c1p7
  - huber_c2p0
  - huber_c2p5
  - huber_adaptive_c
