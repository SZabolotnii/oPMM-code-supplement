# config_gate3.yaml
#
# Gate No.3: J=1 vs J=2 marginal gain < 10 percent. If J=2 (multi-power
# basis) beats J=1 (single fractional basis) by more than 10%, the scope
# expands to mp-oPMM and a decision-log entry is appended (AGENTS.md
# Section 7).
#
# Test file: tests/gates/test_J1_vs_J2_marginal_gain.py
# Satisfies Requirement R12.3.

run_id: gate3_J1_vs_J2
description: >
  Defends the J=1 (single fractional basis) formulation against a J=2
  multi-power alternative. Pass means the closed-form g(alpha; C) anchor
  remains tractable; fail forces scope expansion to mp-oPMM.

replicates: 300

grid:
  k: [4]
  n: [512]
  alpha_MAL: [0.5, 1.0, 2.0]
  p: [4]
  M_norm: [0.0]
  sigma_structure: ["I"]

estimators:
  - opmm_alpha   # J=1
  - opmm_alpha_J2  # J=2 prototype, lives in core/em_patp_J2.py post-gate

gate:
  name: "Gate No.3"
  pass_criterion: "(MSE_J1 - MSE_J2) / MSE_J1 < 0.10 across all alpha_MAL cells"
  on_fail: "scope expansion to mp-oPMM; append Spec.md Section 12 decision log"
